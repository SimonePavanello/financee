name: financiee
description: "Financiee: gestione delle finanze personali (entrate, spese, categorie, report)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Stato
  flutter_riverpod: ^3.5.0
  # Database SQLite (Android/iOS nativo, web via WebAssembly)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  # Grafici
  fl_chart: ^1.3.0
  # Formattazione italiana di date e importi
  intl: ^0.20.3
  # Preferenze (tema)
  shared_preferences: ^2.5.6
  # Export CSV: condivisione su mobile, download sul web
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  web: ^1.1.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  # build_runner < 2.16.2 per restare compatibile con package:test e il
  # test_api fissato da flutter_test.
  build_runner: ">=2.10.0 <2.16.2"
  test: ^1.31.1
  # Usato nei test di migrazione. Versione fissata: deve coincidere con
  # web/sqlite3.wasm (stessa release di sqlite3.dart).
  sqlite3: 3.5.2

flutter:
  uses-material-design: true

  # Plus Jakarta Sans (SIL Open Font License, vedi assets/fonts/OFL.txt),
  # inclusa nell'app: niente download a runtime e funziona offline.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
